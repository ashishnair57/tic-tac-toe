<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Tic Tac Toe</h1>
        <div id="playerChoice">
            <p>Choose your Icon:</p>
            <button class="choice-btn" id="choiceX">X</button>
            <button class="choice-btn" id="choiceO">O</button>
        </div>
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        <div id="status">
            <p>Waiting for players to choose their icons...</p>
        </div>
        <button id="restartBtn" class="hidden">Restart Game</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
