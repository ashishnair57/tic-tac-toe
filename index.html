<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <!-- Game Mode Popup -->
    <div id="gameModePopup" class="popup">
        <h2>Select Game Mode</h2>
        <button id="vsFriendBtn">Play with Friend</button>
        <button id="vsAIBtn">Play with AI</button>
    </div>

    <!-- Icon Selection Popup -->
    <div id="iconChoicePopup" class="popup hidden">
        <h2>Choose Your Icon</h2>
        <button id="choiceX" class="icon-btn x-btn">X</button>
        <button id="choiceO" class="icon-btn o-btn">O</button>
    </div>

    <div class="game-container hidden" id="gameContainer">
        <h1>Tic Tac Toe</h1>
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        <div id="status"><p>Waiting...</p></div>
        <button id="restartBtn" class="hidden">Restart Game</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
